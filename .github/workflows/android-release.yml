# Phase 7 Plan 07-01 Task 5 — tag-triggered Android release build pipeline.
#
# Flow:
#   1. Tag push (v1.0.0-beta.* | v1.0.0-rc.*)
#   2. Checkout + Node 20 + JDK 17 + sops + yq install
#   3. Restore CI age key from SOPS_AGE_KEY_CI secret → ~/.config/sops/age/keys.txt
#   4. sops -d .secrets/prod/mobile-signing.yaml → extract base64 keystore +
#      both passwords; write keystore to apps/mobile-rn/android/app/release.keystore;
#      forward passwords to $GITHUB_ENV
#   5. npm ci (apps/mobile-rn)
#   6. expo/expo-github-action@v8 (EXPO_TOKEN from secrets)
#   7. npx eas build --platform android --profile production --non-interactive
#      --no-wait (Path A: eas.json env block + $GITHUB_ENV propagation lets
#      EAS Cloud builder env honor RUNNING_ECO_RELEASE_* gradle properties)
#
# Pinned versions:
#   - actions/checkout@v4, actions/setup-node@v4, actions/setup-java@v4
#   - expo/expo-github-action@v8 (latest major as of 2026-05-21, current = 8.2.1)
#   - SOPS_VERSION=3.13.1 (matches dev workstation; min ≥3.11 per evidence/tool-versions.txt)

name: Android release build

on:
  push:
    tags:
      - 'v1.0.0-beta.*'
      - 'v1.0.0-rc.*'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/mobile-rn/package-lock.json'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install SOPS + yq
        run: |
          SOPS_VERSION=3.13.1
          sudo curl -sL "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64" -o /usr/local/bin/sops
          sudo chmod +x /usr/local/bin/sops
          sops --version
          sudo curl -sL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Restore SOPS age key
        env:
          SOPS_AGE_KEY_CI: ${{ secrets.SOPS_AGE_KEY_CI }}
        run: |
          mkdir -p ~/.config/sops/age
          echo "$SOPS_AGE_KEY_CI" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt

      - name: Decrypt mobile signing bundle
        run: |
          sops -d .secrets/prod/mobile-signing.yaml > /tmp/mobile-signing.yaml
          yq -r '.android.keystore_base64' /tmp/mobile-signing.yaml | base64 -d > apps/mobile-rn/android/app/release.keystore
          chmod 600 apps/mobile-rn/android/app/release.keystore
          {
            echo "RUNNING_ECO_RELEASE_STORE_PASSWORD=$(yq -r '.android.keystore_password' /tmp/mobile-signing.yaml)"
            echo "RUNNING_ECO_RELEASE_KEY_PASSWORD=$(yq -r '.android.key_password' /tmp/mobile-signing.yaml)"
          } >> "$GITHUB_ENV"
          rm -f /tmp/mobile-signing.yaml

      - name: Install dependencies
        working-directory: apps/mobile-rn
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Trigger EAS build
        working-directory: apps/mobile-rn
        env:
          RUNNING_ECO_RELEASE_STORE_FILE: release.keystore
          RUNNING_ECO_RELEASE_STORE_PASSWORD: ${{ env.RUNNING_ECO_RELEASE_STORE_PASSWORD }}
          RUNNING_ECO_RELEASE_KEY_PASSWORD: ${{ env.RUNNING_ECO_RELEASE_KEY_PASSWORD }}
          RUNNING_ECO_RELEASE_KEY_ALIAS: runningecosystem-release
        run: |
          npx eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --no-wait \
            --message "Phase 7 release — ${GITHUB_REF_NAME}"
