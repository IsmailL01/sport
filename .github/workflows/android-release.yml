# Phase 7 Plan 07-01 Task 5 — tag-triggered Android release build pipeline.
#
# Flow:
#   1. Tag push (v1.0.0-beta.* | v1.0.0-rc.*)
#   2. Checkout + Node 20 + JDK 17 + sops + yq install
#   3. Restore CI age key from SOPS_AGE_KEY_CI secret → ~/.config/sops/age/keys.txt
#   4. sops -d .secrets/prod/mobile-signing.yaml → extract base64 keystore +
#      both passwords; write keystore to apps/mobile-rn/android/app/release.keystore;
#      emit ::add-mask:: directives BEFORE writing to $GITHUB_ENV (P0 incident
#      response 2026-05-22 — bare `echo "X=$value" >> $GITHUB_ENV` does NOT
#      auto-mask; only `${{ secrets.X }}` references do); forward to $GITHUB_ENV
#   5. npm ci (apps/mobile-rn)
#   6. Install eas-cli explicitly via npm (replaces expo/expo-github-action — the
#      `npx eas` invocation failed with "npm error could not determine executable
#      to run" in run 26245775886; root cause: relying on transient PATH from
#      action setup instead of an explicit global install)
#   7. `eas build --platform android --profile production --non-interactive
#      --no-wait` (Path A: eas.json env block + $GITHUB_ENV propagation lets
#      EAS Cloud builder env honor RUNNING_ECO_RELEASE_* gradle properties).
#      EXPO_TOKEN passed via step env from `secrets.EXPO_TOKEN`.
#
# Pinned versions:
#   - actions/checkout@v4, actions/setup-node@v4, actions/setup-java@v4
#   - eas-cli installed via `npm install -g eas-cli` (latest at run-time)
#   - SOPS_VERSION=3.13.1 (matches dev workstation; min ≥3.11 per evidence/tool-versions.txt)
#
# See docs/DECISIONS/0012-keystore-password-leak-2026-05-22.md for incident
# context behind the ::add-mask:: + eas-cli explicit-install changes.

name: Android release build

on:
  push:
    tags:
      - 'v1.0.0-beta.*'
      - 'v1.0.0-rc.*'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/mobile-rn/package-lock.json'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install SOPS + yq
        run: |
          SOPS_VERSION=3.13.1
          sudo curl -sL "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64" -o /usr/local/bin/sops
          sudo chmod +x /usr/local/bin/sops
          sops --version
          sudo curl -sL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Restore SOPS age key
        env:
          SOPS_AGE_KEY_CI: ${{ secrets.SOPS_AGE_KEY_CI }}
        run: |
          mkdir -p ~/.config/sops/age
          echo "$SOPS_AGE_KEY_CI" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt

      - name: Decrypt mobile signing bundle
        run: |
          sops -d .secrets/prod/mobile-signing.yaml > /tmp/mobile-signing.yaml
          yq -r '.android.keystore_base64' /tmp/mobile-signing.yaml | base64 -d > apps/mobile-rn/android/app/release.keystore
          chmod 600 apps/mobile-rn/android/app/release.keystore
          # Read passwords into shell vars first, then register them with the
          # log masker BEFORE any subsequent step (incl. `echo ... >> $GITHUB_ENV`)
          # writes them anywhere visible. Bare `echo "VAR=$value" >> $GITHUB_ENV`
          # does NOT auto-mask — only `${{ secrets.X }}` references do. (See
          # docs/DECISIONS/0012-keystore-password-leak-2026-05-22.md for the
          # P0 incident this guards against.)
          STORE_PASS=$(yq -r '.android.keystore_password' /tmp/mobile-signing.yaml)
          KEY_PASS=$(yq -r '.android.key_password' /tmp/mobile-signing.yaml)
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "RUNNING_ECO_RELEASE_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "RUNNING_ECO_RELEASE_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          # Generate apps/mobile-rn/credentials.json required by EAS Cloud when
          # eas.json `production.android.credentialsSource: "local"` is set.
          # Without this, EAS Cloud falls back to remote/managed credentials and
          # signs the APK with its own auto-generated keystore (observed in CI
          # run 26362716928 / build 9b8ec55c on tag v1.0.0-beta.2). credentials.json
          # is git-ignored; file lives only on the ephemeral runner + the EAS
          # Cloud build environment for the lifetime of this job.
          jq -n \
            --arg pass "$STORE_PASS" \
            --arg keypass "$KEY_PASS" \
            '{
              android: {
                keystore: {
                  keystorePath: "android/app/release.keystore",
                  keystorePassword: $pass,
                  keyAlias: "runningecosystem-release",
                  keyPassword: $keypass
                }
              }
            }' > apps/mobile-rn/credentials.json
          chmod 600 apps/mobile-rn/credentials.json
          rm -f /tmp/mobile-signing.yaml

      - name: Install dependencies
        working-directory: apps/mobile-rn
        run: npm ci

      - name: Install eas-cli
        run: npm install -g eas-cli

      - name: Trigger EAS build
        working-directory: apps/mobile-rn
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          RUNNING_ECO_RELEASE_STORE_FILE: release.keystore
          RUNNING_ECO_RELEASE_STORE_PASSWORD: ${{ env.RUNNING_ECO_RELEASE_STORE_PASSWORD }}
          RUNNING_ECO_RELEASE_KEY_PASSWORD: ${{ env.RUNNING_ECO_RELEASE_KEY_PASSWORD }}
          RUNNING_ECO_RELEASE_KEY_ALIAS: runningecosystem-release
        run: |
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --no-wait \
            --message "Phase 7 release — ${GITHUB_REF_NAME}"
