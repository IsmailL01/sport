# .github/workflows/secret-scan-full.yml
# Nightly cron full-history secret scan — complements backend-ci.yml `secrets-scan-diff`
# PR-only job per RESEARCH Pitfall 10 (never run full-history scan on every PR — slow).
#
# Closes SEC-01 partial from Phase 2: the one-time full-history scan was performed on
# 2026-05-16 (Phase 2 commits 28acb2d..ac2ebd5); this workflow runs it weekly as ongoing
# protection.
name: secret-scan-full

on:
  schedule:
    # Sundays 03:00 UTC = 06:00 Moscow MSK (UTC+3 year-round per Russian Federation
    # policy since 2014) — low-traffic window per RESEARCH §Open Q 3.
    - cron: "0 3 * * 0"
  workflow_dispatch:   # manual `gh workflow run secret-scan-full.yml`

permissions:
  contents: read
  security-events: write

jobs:
  full-history:
    name: Full-history secret scan (gitleaks + trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # FULL git history — only safe in cron (Pitfall 10).
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false   # cron run — no PR к comment on
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # ↑ Personal account (IsmailL01/sport) — license NOT required.
      - name: TruffleHog (full history)
        uses: trufflesecurity/trufflehog@main
        with:
          base: ""                           # no base restriction → scan all commits
          head: ${{ github.ref_name }}
          extra_args: --results=verified,unknown
