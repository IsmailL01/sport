name: Android debug APK

# Builds a universal debug APK (arm64-v8a + x86_64) with JS bundle embedded,
# then uploads it as a GitHub Actions artifact downloadable from the run page.
#
# Use cases:
#   - BlueStacks dev-loop without running Metro locally
#   - Ad-hoc APK sharing with internal testers (download from Actions → Artifacts)
#   - Quick smoke checks on Pixel without needing local Android SDK
#
# NOT a substitute for:
#   - Plan 07-03 pocket-walk validation — that uses the production-signed .aab
#     from android-release.yml (tag push). Production-signing matters for any
#     "this is what closed-beta testers will install" testing.
#
# Triggers:
#   - workflow_dispatch (manual button in Actions UI)
#   - push to feat/cursona-redesign or main when mobile-rn or this workflow changes
#
# Output artifact: `app-debug-<sha>` containing `app-debug.apk` (~80-120MB universal)
# Retention: 14 days (default GH Actions retention for artifacts)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/cursona-redesign
    paths:
      - "apps/mobile-rn/**"
      - ".github/workflows/android-debug-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK (universal)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/mobile-rn/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle caches + wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-debug-${{ hashFiles('apps/mobile-rn/android/**/*.gradle*', 'apps/mobile-rn/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-debug-
            ${{ runner.os }}-gradle-

      - name: Install npm dependencies
        working-directory: apps/mobile-rn
        run: npm ci

      - name: Create .env (public backend URLs + Mapbox token)
        # apiClient.ts reads EXPO_PUBLIC_IDENTITY_URL / EXPO_PUBLIC_SYNC_URL at
        # bundle time via @expo/cli export:embed. Without them, fallback is
        # http://10.0.2.2:8081 (Android emulator loopback) which doesn't
        # resolve on physical Pixel/BlueStacks → "не удалось связаться с
        # сервером" during registration. Backend host is sslip.io public
        # (also shown in SettingsScreen "Backend" row); not a secret.
        #
        # Mapbox pk.* token injected from GH Secret EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN.
        # Without it, MapView/MapSurface inflation throws hard ("Using MapView ...
        # requires providing a valid access token"). The pk.* token IS public-
        # designed for client embedding per Mapbox docs, but per ADR-0006 it's
        # still SOPS/secret-stored to enable cert-restrict revocation control.
        # ::add-mask:: ensures the value never appears verbatim in CI logs.
        #
        # Note: if the production pk.* token has cert SHA-256 restriction that
        # doesn't include the debug keystore cert SHA-256 (FA:C6:17:45:DC:09:
        # 03:78:6F:B9:ED:E6:2A:96:2B:39:9F:73:48:F0:BB:6F:89:9B:83:32:66:75:91:
        # 03:3B:9C), tile loads will return 401 → blank map. Map will NOT crash,
        # but won't render. Fix: add the debug-keystore SHA-256 to Mapbox
        # dashboard token allowlist (one-time user action).
        #
        # EXPO_PUBLIC_UPDATE_MANIFEST_URL left unset on purpose — ADR-0011
        # Amendment 5 gate stays closed (state:'disabled' early return).
        working-directory: apps/mobile-rn
        env:
          EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN }}
        run: |
          if [ -z "$EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN" ]; then
            echo "::error::EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN secret not set; MapView will crash on inflate"
            exit 1
          fi
          # ::add-mask:: was set by GH Actions when EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN
          # was read from secrets — value is masked automatically in any log/output.
          cat > .env <<EOF
          EXPO_PUBLIC_IDENTITY_URL=https://148-253-214-156.sslip.io
          EXPO_PUBLIC_SYNC_URL=https://148-253-214-156.sslip.io
          EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN=$EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN
          EOF
          echo "Created .env (Mapbox token masked):"
          # Print first two lines verbatim, mask the third
          head -2 .env
          echo "EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN=<masked, length=$(echo -n "$EXPO_PUBLIC_MAPBOX_ACCESS_TOKEN" | wc -c)>"

      - name: Build debug APK (universal ABI + JS bundle embedded)
        working-directory: apps/mobile-rn/android
        run: |
          ./gradlew :app:assembleDebug \
            -PrunningEcoAbiFilters="arm64-v8a,x86_64" \
            -PreactNativeArchitectures="arm64-v8a,x86_64" \
            -PrunningEcoEmbedJSInDebug=true \
            --no-daemon

      - name: Show APK info
        working-directory: apps/mobile-rn/android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$APK" ]; then
            echo "::error::APK not produced at expected path $APK"
            find app/build/outputs/apk -type f -name "*.apk" || true
            exit 1
          fi
          echo "APK: $APK"
          echo "Size: $(du -h "$APK" | cut -f1)"
          echo "SHA256: $(sha256sum "$APK" | awk '{print $1}')"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: apps/mobile-rn/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
