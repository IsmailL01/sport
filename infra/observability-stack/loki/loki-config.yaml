# Phase 5 / Plan 05-07 v2 / D-27 (amended) — Loki single-binary on srv1561293
# 14-day retention (down from D-27 original 30d; R-02 colocation mitigation per ADR-0010).
# Auth disabled (single-tenant); access gate is Caddy @allowed_loki matcher (D-36).

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 336h    # 14 days (R-02 mitigation per ADR-0010)
  reject_old_samples: true
  reject_old_samples_max_age: 168h    # 7 days

# Compactor for retention-based deletion
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  ring:
    kvstore:
      store: inmemory
  enable_api: true
