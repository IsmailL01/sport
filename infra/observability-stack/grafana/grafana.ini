; Phase 5 / Plan 05-07 v2 / D-34 — Grafana minimal config
; Most settings driven by GF_* env vars in docker-compose; this file covers what env vars can't.

[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
protocol = http
http_addr = 0.0.0.0
http_port = 3000
# root_url + serve_from_sub_path set via GF_SERVER_* env vars

[security]
disable_initial_admin_creation = false
# admin_user + admin_password__file set via GF_SECURITY_* env vars

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Viewer

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[log]
mode = console
level = info

[unified_alerting]
enabled = true
