---
# Production inventory — existing VPS at 148.253.214.156 (provider-agnostic per D-25).
#
# Bootstrap-vs-steady-state SSH user:
#   - Wave 1 first run: `ansible_user: root` (deploy user не существует ещё).
#     После common role применяется: deploy user создан + SSH key authorized
#     + root login disabled через sshd_config.d/99-hardening.conf.
#   - Wave 1 second run + Wave 2+: SWITCH `ansible_user: deploy` ниже
#     (закомментируй root line, раскомментируй deploy line).
#
# See SUMMARY 03-01 §Switchover-to-deploy для процедуры.
all:
  children:
    app_servers:
      hosts:
        prod-app-01:
          ansible_host: 148.253.214.156
          # ansible_user: root          # SUPERSEDED 2026-05-17 — bootstrap done; root SSH now disabled
          ansible_user: deploy          # steady-state user; sudo NOPASSWD per D-20
          ansible_python_interpreter: /usr/bin/python3
