---
# Dev inventory — localhost only (CONTEXT D-03 PARTIAL post-pivot).
# Ansible НЕ управляет dev — local docker-compose loop сохраняется.
# Playbook commands `ansible-playbook site.yml -i inventory/dev` no-op'ятся
# для остальных hosts (нет реальных app_servers здесь — namespace для
# симметрии с prod inventory + future-proofing).
all:
  children:
    app_servers:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
