[defaults]
inventory             = ./inventory
roles_path            = ./roles
collections_paths     = ~/.ansible/collections
host_key_checking     = True
retry_files_enabled   = False
stdout_callback       = default
result_format         = yaml
log_path              = /tmp/ansible-sport.log

[ssh_connection]
pipelining            = True
ssh_args              = -o ControlMaster=auto -o ControlPersist=60s
