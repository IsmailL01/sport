---
# CRITICAL ORDERING per RESEARCH §UFW gotcha + plan <forbidden>:
# 1. Set default policies (deny in, allow out)
# 2. Allow SSH from dev_admin_ips FIRST (else Ansible locks itself out when UFW enables)
# 3. Allow public ports (443 Caddy)
# 4. Explicit deny public ports (4222/5432/6379/9000 — defense in depth)
# 5. Enable UFW LAST

- name: Set UFW default policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }
  tags: [ufw]

- name: Allow SSH (22/TCP) from anywhere — rate-limited (D-24 REVISED 2026-05-17)
  # D-24 originally allowed SSH only from {{ dev_admin_ips }} /32 — but residential
  # ISP rotates the dev IP (observed 91.92.33.145 → 85.239.149.26 within 38 min),
  # which silently locks the dev out next time it tries SSH. For solo-dev v1.0
  # closed-beta, actual SSH defense = key-only auth (D-19) + root login disabled
  # (D-19) + UFW rate-limit (6 connections / 30s per source IP — UFW's `limit`
  # action — blocks brute-force without locking out legit users on IP rotation).
  # v1.1 follow-up: if static dev IP / VPN gateway / bastion lands, narrow back
  # to per-IP allowlist. Full rationale в 03-CONTEXT.md §D-24 REVISION.
  community.general.ufw:
    rule: limit
    port: '22'
    proto: tcp
  tags: [ufw]

- name: Allow public TCP ports (Caddy 443 per D-16)
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ ufw_allowed_tcp_public }}"
  tags: [ufw]

- name: Explicit deny public TCP ports (defense in depth — D-07/D-08/D-24)
  community.general.ufw:
    rule: deny
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ ufw_denied_tcp_public }}"
  tags: [ufw]

- name: Enable UFW (LAST — after allow rules в place)
  community.general.ufw:
    state: enabled
  tags: [ufw]

- name: Show UFW status для verification
  ansible.builtin.command: ufw status numbered
  register: ufw_status
  changed_when: false
  tags: [ufw]

- name: Display UFW status
  ansible.builtin.debug:
    var: ufw_status.stdout_lines
  tags: [ufw]
