---
# CRITICAL ORDERING per plan's <forbidden> block + D-19/D-20:
# 0. Pre-flight: heal any legacy /etc/apt/sources.list.d/docker.list conflict
#    (existing VPS may have a manual-install era duplicate Signed-By line that
#    blocks `apt update` — Rule 1 bug fix surfaced during Wave 1 first-run on
#    148.253.214.156; idempotent на fresh VPS — file simply doesn't exist).
# 1. Apt update + base packages (includes ufw — needed by ufw role next)
# 2. Ensure deploy group + user exist
# 3. Install authorized SSH keys для deploy user BEFORE sshd hardening drop-in is
#    in place (handlers run at end of play, so by the time `restart ssh` fires
#    the deploy user already has authorized_keys + sudo).
# 4. Install sshd hardening drop-in (notify: restart ssh — runs at end of play)
# 5. Narrow sudoers для deploy user (D-20) — validated through visudo -cf

- name: Pre-flight — check для legacy docker.gpg keyring (heal Signed-By conflict)
  ansible.builtin.stat:
    path: /etc/apt/keyrings/docker.gpg
  register: legacy_docker_gpg
  tags: [common]

# When a legacy /etc/apt/keyrings/docker.gpg exists from a pre-Ansible manual
# Docker install, apt sees TWO Signed-By lines in docker.list (or rejects mixed)
# and refuses to update its cache. We heal by writing the canonical .asc-only
# source AND ensuring docker.asc is present (download if missing), then removing
# the legacy .gpg keyring. Idempotent block — runs only when .gpg detected.
- name: Heal legacy docker repo setup (idempotent block)
  when: legacy_docker_gpg.stat.exists
  block:
    - name: Ensure /etc/apt/keyrings exists (pre-canonical .asc download)
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download canonical Docker apt key (.asc) — needed before docker.list rewrite
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
        force: false

    - name: Rewrite docker.list as single canonical .asc-signed source
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: |
          deb [arch={{ ansible_architecture | replace('aarch64','arm64') | replace('x86_64','amd64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        owner: root
        group: root
        mode: '0644'

    - name: Remove legacy docker.gpg keyring (closure of heal)
      ansible.builtin.file:
        path: /etc/apt/keyrings/docker.gpg
        state: absent
  tags: [common]

- name: Apt update + base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    update_cache: true
    cache_valid_time: 3600
  tags: [common]

- name: Ensure deploy group exists
  ansible.builtin.group:
    name: "{{ deploy_group }}"
    state: present
  check_mode: false   # paired with user-creation below to permit --check dry-run on fresh VPS
  tags: [common]

- name: Create deploy user (non-root per CONTEXT D-20)
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    shell: /bin/bash
    create_home: true
    state: present
  # check_mode: false lets the user actually be created during --check dry-runs,
  # so the subsequent ansible.posix.authorized_key task can resolve the deploy
  # user's homedir (known check-mode limitation, ansible-collections/ansible.posix#21).
  # Idempotent — running for real в check mode is safe (creates user once).
  check_mode: false
  tags: [common]

- name: Install authorized SSH keys для devs (D-19) — BEFORE sshd hardening
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    state: present
    key: "{{ item.value }}"
  loop: "{{ dev_ssh_pubkeys | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  tags: [common]

- name: Narrow sudoers для deploy user (D-20) — BEFORE sshd hardening
  ansible.builtin.copy:
    dest: /etc/sudoers.d/deploy
    content: |
      {{ deploy_user }} ALL=(ALL) NOPASSWD: /bin/systemctl, /usr/bin/docker, /usr/bin/docker compose, /bin/shred /run/sport.env
    owner: root
    group: root
    mode: '0440'
    validate: '/usr/sbin/visudo -cf %s'
  tags: [common]

- name: Install SSH hardening drop-in (PermitRootLogin no + PasswordAuthentication no per D-19)
  ansible.builtin.copy:
    src: sshd_config_overrides
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart ssh
  tags: [common]
