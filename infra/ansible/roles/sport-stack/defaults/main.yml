---
# sport-stack role defaults (Phase 3 Plan 03-02 — Wave 2).
# Encodes CONTEXT D-04 + D-12 + D-14 + D-15 + D-16 + D-21 + D-26 invariants.

# Deploy target paths (per CONTEXT D-04 + D-15)
sport_install_dir: /opt/sport
sport_env_file: /run/sport.env             # tmpfs (RAM-only per D-15)
sport_env_mode: '0600'
sport_env_owner: "{{ deploy_user }}"
sport_env_group: "{{ deploy_group }}"

# SOPS slot inventory (D-26 post-pivot — NO hetzner.yaml)
sport_sops_groups:
  - shared
  - mapbox
  - oauth

# systemd unit
sport_service_name: sport-stack.service
sport_compose_file: "{{ sport_install_dir }}/services/backend/docker-compose.prod.yml"

# Smoke probe retry (5 × 30s = 2.5 min — covers Caddy ACME issuance window)
sport_smoke_retries: 5
sport_smoke_delay_seconds: 30

# Migration container service name (matches docker-compose.prod.yml L101)
sport_migrate_service: migrations

# Repo sync strategy — rsync-based (no git remote in this worktree per
# Plan 03-01 SUMMARY §Carry-forward #2 option b). Controller-side source =
# the playbook_dir's grand-parent (worktree root), filtered to services/backend/
# tree + supporting files. See tasks/sync_repo.yml.
sport_repo_sync_strategy: rsync
sport_repo_local_root: "{{ playbook_dir }}/../.."

# ──────────────────────────────────────────────────────────────────────────────
# Image transfer (Plan 04-04 Wave 4 — save/scp/load flow, no GHCR pull on prod)
# ──────────────────────────────────────────────────────────────────────────────
# Controller-side: docker pull + gh-attest verify + docker save | gzip into a
# staging dir, then synchronize tar.gz files to remote /opt/sport-stack/images/
# and `docker load` them on the host. Compose `up -d` then matches the
# image: ghcr.io/ismaill01/<svc>:<tag> ref against the locally-loaded image —
# no network pull happens on prod.
#
# Activation: pass `-e sport_stack_tag=<gh-cd-tag>` to ansible-playbook. When
# unset (e.g. routine config-only re-deploys), the transfer block is skipped.
sport_services_with_image:
  - identity
  - activity-sync
  - feed
  - media
  - messaging
  - notifications
  - realtime-gw
  - social-graph
sport_image_registry: ghcr.io/ismaill01
sport_image_remote_dir: /opt/sport-stack/images
sport_image_local_stage_dir: "/tmp/sport-stack-images-{{ sport_stack_tag | default('unset') }}"
sport_image_platform: linux/amd64
sport_image_verify_enabled: true     # gh attestation verify gate before transfer
sport_image_keep_local_stage: false  # rm tarball stage dir after successful remote load
