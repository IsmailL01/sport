# Self-hosted deploy override — Let's Encrypt via DNS-01 variant.
# Successor to docker-compose.deploy.yml once the user has:
#   1. A DuckDNS hostname (e.g. messenger-am.duckdns.org) pointing at the
#      server IP — set via the DuckDNS API or web UI
#   2. The DuckDNS account token (one token per account; DNS-01 plugin
#      uses it to publish/clear TXT records on _acme-challenge.<host>)
#
# Set in .env.prod (do NOT commit):
#   BACKEND_DOMAIN=<your-name>.duckdns.org
#   DUCKDNS_API_TOKEN=<token-from-www.duckdns.org-after-sign-in>
#
# Usage:
#   docker compose -f docker-compose.prod.yml -f docker-compose.deploy-le.yml \
#       --env-file .env.prod up -d --build
#
# Builds a custom Caddy image with caddy-dns/cloudflare plugin baked in
# (stock caddy:2.8-alpine has no DNS providers). Cert issuance happens on
# first request; subsequent renewals are automatic (~30 days before expiry).

services:
  identity:
    image: re-identity:local
  activity-sync:
    image: re-activity-sync:local
  media:
    image: re-media:local
  notifications:
    image: re-notifications:local
  realtime-gw:
    image: re-realtime-gw:local
  messaging:
    image: re-messaging:local
  feed:
    image: re-feed:local
  social-graph:
    image: re-social-graph:local

  gateway:
    image: re-gateway:le
    build:
      context: gateway
      dockerfile: Dockerfile
    volumes:
      - ./gateway/Caddyfile.le:/etc/caddy/Caddyfile:ro
      - ./gateway/admin:/srv/admin:ro
      - caddy_data:/data
      - caddy_config:/config
    ports: !override
      - "8444:8444"
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?need CADDY_ACME_EMAIL for LE notifications}
      BACKEND_DOMAIN: ${BACKEND_DOMAIN:?need BACKEND_DOMAIN — e.g. api.basicworld.online}
      DUCKDNS_API_TOKEN: ${DUCKDNS_API_TOKEN:?need DUCKDNS_API_TOKEN from www.duckdns.org}
