# Дефолтные значения identity-сервиса.
# Override через `helm install ... -f values-staging.yaml` или `--set`.

image:
  repository: ghcr.io/runningecosystem/identity
  tag: "" # подставляется CI/CD из git SHA
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  port: 8081

# Конфиг через ENV. Секреты — через external-secrets-operator (P3-A-10).
config:
  httpAddr: ":8081"
  # DB URL подставляется из secret ниже.

# Postgres-секрет создаётся отдельно (через external-secrets-operator или sealed-secrets).
secrets:
  dbUrlSecretName: identity-db-url
  jwtSecretName: identity-jwt-secret

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Probes — вызывает /healthz который у нас уже есть.
probes:
  liveness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 2
    periodSeconds: 5

# HPA отключён в дефолте — включается per-environment.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

nodeSelector: {}
tolerations: []
affinity: {}
