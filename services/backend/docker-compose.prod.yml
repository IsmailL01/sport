# Production stack — самодостаточный compose, не наследует от docker-compose.yml.
# Использование:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Отличия от dev (docker-compose.yml):
#   - postgres не торчит наружу
#   - identity/activity-sync порты не торчат наружу
#   - gateway слушает 80/443 (HTTPS через Let's Encrypt + sslip.io)
#   - migrations run-once init job, сервисы ждут её
#   - все сервисы restart: unless-stopped
#   - пароли и JWT_SECRET из env

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: re_postgres
    environment:
      POSTGRES_USER: re
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?need POSTGRES_PASSWORD}
      POSTGRES_DB: running_ecosystem
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "re"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # NATS JetStream — events bus для cross-service async communication
  # (см. план Phase 8 / messenger). Persistent file storage, 7d retention.
  nats:
    image: nats:2.11-alpine
    container_name: re_nats
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 256m
    restart: unless-stopped

  # Redis — rate limiting, presence, timeline cache, hot conversation cache
  redis:
    image: redis:7-alpine
    container_name: re_redis
    command:
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--appendonly"
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 320m
    restart: unless-stopped

  migrations:
    image: migrate/migrate:v4.18.1
    container_name: re_migrations
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://re:${POSTGRES_PASSWORD}@postgres:5432/running_ecosystem?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  identity:
    build:
      context: .
      dockerfile: identity/Dockerfile
    container_name: re_identity
    environment:
      IDENTITY_HTTP_ADDR: ":8081"
      IDENTITY_DB_URL: "postgres://re:${POSTGRES_PASSWORD}@postgres:5432/running_ecosystem?sslmode=disable"
      IDENTITY_JWT_SECRET: "${JWT_SECRET:?need JWT_SECRET >=32 chars}"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  activity-sync:
    build:
      context: .
      dockerfile: activity-sync/Dockerfile
    container_name: re_activity_sync
    environment:
      ACTIVITY_SYNC_HTTP_ADDR: ":8082"
      ACTIVITY_SYNC_DB_URL: "postgres://re:${POSTGRES_PASSWORD}@postgres:5432/running_ecosystem?sslmode=disable"
      IDENTITY_JWT_SECRET: "${JWT_SECRET:?need JWT_SECRET >=32 chars}"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  # notifications — in-app + Expo Push (Phase A4).
  notifications:
    build:
      context: .
      dockerfile: notifications/Dockerfile
    container_name: re_notifications
    environment:
      NOTIFICATIONS_HTTP_ADDR: ":8087"
      NOTIFICATIONS_DB_URL: "postgres://re:${POSTGRES_PASSWORD}@postgres:5432/running_ecosystem?sslmode=disable"
      IDENTITY_JWT_SECRET: "${JWT_SECRET:?need JWT_SECRET >=32 chars}"
      NATS_URL: "nats://nats:4222"
      EXPO_ACCESS_TOKEN: "${EXPO_ACCESS_TOKEN:-}"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    restart: unless-stopped

  # realtime-gw — WebSocket terminus, NATS-subscribed (Phase A3).
  realtime-gw:
    build:
      context: .
      dockerfile: realtime-gw/Dockerfile
    container_name: re_realtime_gw
    environment:
      REALTIME_GW_HTTP_ADDR: ":8090"
      IDENTITY_JWT_SECRET: "${JWT_SECRET:?need JWT_SECRET >=32 chars}"
      NATS_URL: "nats://nats:4222"
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  # messaging — conversations + messages + outbox publisher (Phase A2).
  messaging:
    build:
      context: .
      dockerfile: messaging/Dockerfile
    container_name: re_messaging
    environment:
      MESSAGING_HTTP_ADDR: ":8083"
      MESSAGING_DB_URL: "postgres://re:${POSTGRES_PASSWORD}@postgres:5432/running_ecosystem?sslmode=disable"
      IDENTITY_JWT_SECRET: "${JWT_SECRET:?need JWT_SECRET >=32 chars}"
      NATS_URL: "nats://nats:4222"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    restart: unless-stopped

  # social-graph — profiles, follows, blocks, search-by-username
  # (см. план: Phase A1, Phase 8 / messenger).
  social-graph:
    build:
      context: .
      dockerfile: social-graph/Dockerfile
    container_name: re_social_graph
    environment:
      SOCIAL_GRAPH_HTTP_ADDR: ":8084"
      SOCIAL_GRAPH_DB_URL: "postgres://re:${POSTGRES_PASSWORD}@postgres:5432/running_ecosystem?sslmode=disable"
      IDENTITY_JWT_SECRET: "${JWT_SECRET:?need JWT_SECRET >=32 chars}"
      NATS_URL: "nats://nats:4222"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    image: caddy:2.8-alpine
    container_name: re_gateway
    volumes:
      - ./gateway/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:?need CADDY_ACME_EMAIL for Lets Encrypt}
    depends_on:
      - identity
      - activity-sync
      - social-graph
      - messaging
      - realtime-gw
      - notifications
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  nats_data:
  redis_data:
