openapi: 3.1.0
info:
  title: Running Ecosystem — Identity Service
  description: |
    Регистрация, login, JWT, refresh-токены. Phase 2 / P2-A-02.
    См. [docs/RUNNING_ECOSYSTEM_TZ.md](../../docs/RUNNING_ECOSYSTEM_TZ.md) §5.4.
  version: 0.1.0
servers:
  - url: http://localhost:8081
    description: Local dev
  - url: https://api-staging.runningecosystem.app
    description: Staging (P3+)

paths:
  /healthz:
    get:
      summary: Liveness probe
      tags: [system]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }

  /auth/register:
    post:
      summary: Регистрация нового пользователя
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь создан, выпущена пара токенов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPairResponse' }
        '400':
          description: Невалидный email или пароль (< 8 символов)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Email уже зарегистрирован
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      summary: Login по email + password
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPairResponse' }
        '401':
          description: Неверный email или пароль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/refresh:
    post:
      summary: Обновить пару токенов через refresh
      description: |
        Старый refresh-токен **revoked** (rotation). Если уже revoked / expired
        — возвращается 401.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPairResponse' }
        '401':
          description: Refresh-токен невалиден / revoked / expired

  /auth/logout:
    post:
      summary: Logout — отзыв конкретного refresh-токена
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Refresh отозван (или его уже не было — idempotent)

  /auth/request-code:
    post:
      summary: Запрос OTP-кода на email
      description: |
        Phase 8/M migration 0020. Отправляет одноразовый код на email; ответ всегда 204
        чтобы не раскрывать наличие аккаунта. Rate-limit 5/min (закрывает EDGE-01).
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '204':
          description: Код отправлен (idempotent — ответ одинаков и для unknown email).

  /auth/login-with-code:
    post:
      summary: Login по email + одноразовому OTP-коду
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string, minLength: 4, maxLength: 8 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPairResponse' }
        '401':
          description: Неверный код / истёкший / уже использован

  /me:
    get:
      summary: Профиль текущего пользователя
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401':
          description: Bearer-токен отсутствует / невалиден / expired

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 256 }
        displayName: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    TokenPairResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: "Секунды до истечения access-токена" }
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        locale: { type: string, example: en }
        timezone: { type: string, example: UTC }

    Error:
      type: object
      properties:
        error:
          type: string
          description: Машинно-читаемый код ошибки.
          example: email_exists
        message:
          type: string
          description: Human-readable.
