# Shared OpenAPI 3.1.0 parameters.
# Phase 1 / REL-01. См. ADR-0007.
#
# Cross-file $ref: '../<service>.yaml' --> './_shared/parameters.yaml#/components/parameters/<name>'
openapi: 3.1.0
info:
  title: Running Ecosystem — Shared Parameters
  description: |
    Общие path/query параметры. Phase 1 / REL-01.
  version: 0.1.0
paths: {}
components:
  parameters:
    cursor:
      name: cursor
      in: query
      required: false
      description: Cursor для пагинации (см. `Pagination` в schemas.yaml).
      schema:
        type: string

    limit:
      name: limit
      in: query
      required: false
      description: Размер страницы (max 200, default 50).
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    sessionId:
      name: id
      in: path
      required: true
      description: UUID сессии.
      schema:
        type: string
        format: uuid

    userId:
      name: user_id
      in: path
      required: true
      description: UUID пользователя.
      schema:
        type: string
        format: uuid

    flagName:
      name: flag_name
      in: path
      required: true
      description: Имя feature flag (snake_case, см. ADR-0007 §3).
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]*$'
