openapi: 3.1.0
info:
  title: Running Ecosystem — Messaging Service
  description: |
    Чаты, conversations, messages, реакции. Phase 1 / REL-01.
    Все endpoint'ы кроме `/healthz` требуют Bearer JWT.

    **Идемпотентность.**
    - `POST /conversations` — upsert по (initiatorId, peerId) для DM либо по
      `clientConversationId` для group; повторный вызов не создаёт дубля.
    - `POST /conversations/{id}/messages` — server-генерируемый id;
      клиент шлёт `clientMessageId` для дедупликации outbox-ретраев.
  version: 0.1.0
servers:
  - url: http://localhost:8083
    description: Local dev
  - url: https://api-staging.runningecosystem.app
    description: Staging (P3+)

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      summary: Liveness probe
      tags: [system]
      security: []
      responses:
        '200': { description: OK }

  /conversations:
    post:
      summary: Создать / найти DM или group conversation
      tags: [conversations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationCreate' }
      responses:
        '200':
          description: Existing conversation found (idempotent)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: './_shared/responses.yaml#/components/responses/Unauthorized' }
    get:
      summary: Список своих conversations
      tags: [conversations]
      parameters:
        - $ref: './_shared/parameters.yaml#/components/parameters/cursor'
        - $ref: './_shared/parameters.yaml#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Conversation' }
                  nextCursor:
                    oneOf:
                      - { type: string }
                      - { type: 'null' }
        '401': { $ref: './_shared/responses.yaml#/components/responses/Unauthorized' }

  /conversations/{id}:
    get:
      summary: Метаданные conversation
      tags: [conversations]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: './_shared/responses.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared/responses.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared/responses.yaml#/components/responses/NotFound' }
    patch:
      summary: Обновить conversation (только владелец / админ-группы)
      tags: [conversations]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: './_shared/responses.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared/responses.yaml#/components/responses/Forbidden' }

  /conversations/{id}/members:
    get:
      summary: Список участников
      tags: [members]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Member' }
        '401': { $ref: './_shared/responses.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared/responses.yaml#/components/responses/Forbidden' }
    post:
      summary: Добавить участников (admin role)
      tags: [members]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties:
                userIds:
                  type: array
                  items: { type: string, format: uuid }
                  maxItems: 50
      responses:
        '204': { description: Added }
        '401': { $ref: './_shared/responses.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared/responses.yaml#/components/responses/Forbidden' }

  /conversations/{id}/members/{userId}:
    delete:
      summary: Удалить участника
      tags: [members]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Removed }
        '401': { $ref: './_shared/responses.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared/responses.yaml#/components/responses/Forbidden' }
    patch:
      summary: Сменить роль участника
      tags: [members]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [member, admin] }
      responses:
        '204': { description: Role changed }
        '401': { $ref: './_shared/responses.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared/responses.yaml#/components/responses/Forbidden' }

  /conversations/{id}/messages:
    post:
      summary: Отправить сообщение
      tags: [messages]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401': { $ref: './_shared/responses.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared/responses.yaml#/components/responses/Forbidden' }
        '429': { $ref: './_shared/responses.yaml#/components/responses/RateLimited' }
    get:
      summary: История сообщений (newest first; cursor pagination)
      tags: [messages]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: './_shared/parameters.yaml#/components/parameters/cursor'
        - $ref: './_shared/parameters.yaml#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
                  nextCursor:
                    oneOf:
                      - { type: string }
                      - { type: 'null' }
        '401': { $ref: './_shared/responses.yaml#/components/responses/Unauthorized' }

  /conversations/{id}/read:
    post:
      summary: Отметить conversation как прочитанный (через lastMessageId)
      tags: [messages]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upToMessageId]
              properties:
                upToMessageId: { type: string, format: uuid }
      responses:
        '204': { description: Read receipt updated }
        '401': { $ref: './_shared/responses.yaml#/components/responses/Unauthorized' }

  /messages/{id}:
    delete:
      summary: Удалить своё сообщение
      tags: [messages]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted (tombstone left if reactions/receipts exist) }
        '401': { $ref: './_shared/responses.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared/responses.yaml#/components/responses/Forbidden' }
    patch:
      summary: Редактировать своё сообщение (ограниченное окно)
      tags: [messages]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401': { $ref: './_shared/responses.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared/responses.yaml#/components/responses/Forbidden' }

  /messages/{id}/reactions:
    post:
      summary: Добавить реакцию (emoji)
      tags: [reactions]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji: { type: string, maxLength: 16 }
      responses:
        '204': { description: Reaction added (idempotent) }
        '401': { $ref: './_shared/responses.yaml#/components/responses/Unauthorized' }

  /messages/{id}/reactions/{emoji}:
    delete:
      summary: Убрать реакцию
      tags: [reactions]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: emoji
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Reaction removed }
        '401': { $ref: './_shared/responses.yaml#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Conversation:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [dm, group] }
        title: { type: [string, 'null'] }
        memberCount: { type: integer }
        lastMessageAt:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
        unreadCount: { type: integer }

    ConversationCreate:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [dm, group] }
        peerUserId: { type: string, format: uuid, description: "Для dm — обязательно" }
        title: { type: string, maxLength: 80 }
        memberUserIds:
          type: array
          items: { type: string, format: uuid }
          maxItems: 50

    ConversationPatch:
      type: object
      properties:
        title: { type: string, maxLength: 80 }

    Member:
      type: object
      properties:
        userId: { type: string, format: uuid }
        role: { type: string, enum: [member, admin] }
        joinedAt: { type: string, format: date-time }

    Message:
      type: object
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        authorUserId: { type: string, format: uuid }
        body: { type: [string, 'null'] }
        mediaUrls:
          type: array
          items: { type: string, format: uri }
        createdAt: { type: string, format: date-time }
        editedAt:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
        deleted: { type: boolean }
        reactions:
          type: array
          items:
            type: object
            properties:
              emoji: { type: string }
              userIds: { type: array, items: { type: string, format: uuid } }

    MessageCreate:
      type: object
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
        mediaUrls:
          type: array
          items: { type: string, format: uri }
          maxItems: 10
        clientMessageId:
          type: string
          description: |
            Опциональный uuid от клиента для дедупликации outbox-ретраев.
            Сервер хранит uniq (user, clientMessageId) ~24h.
