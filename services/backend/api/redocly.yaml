# Redocly CLI config for Running Ecosystem OpenAPI specs.
# Phase 1 / REL-01. См. ADR-0007 §1.
#
# Initial v1.0 ruleset: permissive — мы только что extend-нули
# from 2 to 8 services и хотим, чтобы lint проходил без принуждения
# полностью документировать все 4xx ответы за один проход.
#
# Цель: ужесточить в v1.1 (включить operation-4xx-response и убрать
# selective overrides) когда покрытие схем достигнет 100%.

extends:
  - recommended

apis:
  # Phase 1 / REL-01: новые сервисные YAMLs созданы со $ref на _shared/.
  feed@v1.0:
    root: ./feed.yaml
  social-graph@v1.0:
    root: ./social-graph.yaml
  messaging@v1.0:
    root: ./messaging.yaml
  realtime-gw@v1.0:
    root: ./realtime-gw.yaml
  notifications@v1.0:
    root: ./notifications.yaml
  media@v1.0:
    root: ./media.yaml
  gateway@v1.0:
    root: ./gateway.yaml
  # identity.yaml + activity-sync.yaml — pre-existing (Phase 2/P2-A pattern).
  # Содержат legacy `nullable: true` (OpenAPI 3.0 синтаксис) — backport на
  # 3.1.0 `oneOf`/`type: [...]` + переключение на _shared/ — v1.0.x cleanup
  # (см. docs/API-CONTRACT-v1.0.md §"Known follow-ups").
  # НЕ включены в apis: чтобы `redocly lint` без аргументов не падал.

rules:
  # v1.0 relaxation: позволяем endpoints без полного перечня 4xx
  # (v1.1 переключим в `error` когда добавим во все pathItems).
  operation-4xx-response: off
  # Permit отсутствие operationId — у нас path+method уникальны и
  # codegen не используется в v1.0.
  operation-operationId: off
  # Permit отсутствие `tags` (некоторые системные endpoints без тэгов).
  operation-tag-defined: off
  # Безопасные дефолты, без trailing-slash.
  no-server-trailing-slash: error
  # /admin/ — реальный Caddy-served static path с trailing slash; relax.
  no-path-trailing-slash: off
  # We do reuse $ref components cross-file; intra-file may show "unused" — relax.
  no-unused-components: off
  # localhost in `servers:` is intentional (Local dev) — relax.
  no-server-example.com: off
  # License is corporate-internal; not required.
  info-license: off
  # Examples checks могут шуметь при cross-file $ref → relax.
  no-invalid-media-type-examples: warn
  # security-defined enforced per-operation via security: [] (public) or inherited.
  security-defined: error
