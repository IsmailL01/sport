# SOPS configuration — Phase 2 / SEC-02 / CONTEXT D-01..D-05
# Encrypts `.secrets/**/*.yaml` against the developer age public-key list below.
#
# Backend: age (X25519 + ChaCha20-Poly1305) — NOT PGP/GPG, NOT cloud KMS.
# Reason (D-01): zero infra dependency, offline rotation, simple multi-recipient
# semantics, master keys stay on developer workstations + sealed backup (D-04).
#
# Rotation command (non-destructive — re-wraps DEK against new recipient list,
# does NOT re-encrypt plaintext values):
#     sops updatekeys .secrets/<env>/*.yaml
#
# Pitfall 5 mitigation: see .gitattributes for the `-text` rule that disables
# git's 3-way merge driver on encrypted ciphertext.
#
# Recipient list (comma-separated string per SOPS spec):
#   - DEV_A: age1ph7d4a62n9ngghvt5lzgh4eywfayzgrzx9mq6rfzpgp9sme0eg0snl33my
#   - TODO(DEV_B): append second developer's age public key once provided.
#       Until then, .secrets/<env>/*.yaml decrypts only with DEV_A's key — single
#       point of failure for bus factor (T-02-04). After DEV_B appends, rotate:
#           sops updatekeys .secrets/<env>/*.yaml
#       (non-destructive — re-wraps the data-encryption key against the new
#       recipient list, does NOT re-encrypt plaintext values).
#   - CI: age19ysu774h4crzynkpf9pjpe829cxt0e3ckgfmnkweag0h7dxmp4kqn9vswx
#       ✓ Added in Phase 7 Plan 07-01 Task 1 — lifts D-14-CI-AGE-KEY deferral
#       (CI private half lives in GitHub Actions secret SOPS_AGE_KEY_CI; the public
#       half is here; sops updatekeys re-wrapped all .secrets/prod/*.yaml DEKs
#       against both DEV_A + CI recipients on 2026-05-21).
creation_rules:
  - path_regex: \.secrets/.*\.yaml$
    age: >-
      age1ph7d4a62n9ngghvt5lzgh4eywfayzgrzx9mq6rfzpgp9sme0eg0snl33my,
      age19ysu774h4crzynkpf9pjpe829cxt0e3ckgfmnkweag0h7dxmp4kqn9vswx
